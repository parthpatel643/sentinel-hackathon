[project]
name = "core-api"
version = "0.1.0"
description = "Sentinel Platform core API — REST, WebSocket, registry, search, alerts"
requires-python = ">=3.13"
dependencies = [
    "sentinel-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]
