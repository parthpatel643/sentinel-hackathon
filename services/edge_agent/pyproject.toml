[project]
name = "edge-agent"
version = "0.1.0"
description = "Sentinel Platform edge agent — capture, decode, schedule, infer, publish"
requires-python = ">=3.13"
dependencies = [
    "sentinel-core",
    "httpx>=0.28",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
    "scipy>=1.14",
    "onnxruntime>=1.30",
    "fast-alpr>=0.4",
    "fast-plate-ocr>=1.1",
    "open-image-models>=0.6",
]

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_agent"]
