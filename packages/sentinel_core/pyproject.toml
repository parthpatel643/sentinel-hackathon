[project]
name = "sentinel-core"
version = "0.1.0"
description = "Shared domain model, event schemas, PTS clock and event-bus port for the Sentinel Platform"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-ulid>=3.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "nats-py>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_core"]
