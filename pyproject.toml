[project]
name = "sentinel-platform"
version = "0.1.0"
description = "Unified CCTV integration and AI video-analytics platform (Gujarat Police Innovation Challenge 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sentinel-core",
    "core-api",
    "edge-agent",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
sentinel-core = { workspace = true }
core-api = { workspace = true }
edge-agent = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/sentinel_core/src", "services/core_api/src", "services/edge_agent/src"]
extend-exclude = ["docs", "*.md", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "DTZ"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = ["packages/sentinel_core/src", "services/core_api/src", "services/edge_agent/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["nats.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error"]
